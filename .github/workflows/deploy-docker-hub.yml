name: Deploy to Docker Hub

on:
  push:
    branches: [main]

env:
  SSH_SERVER: ${{secrets.SSH_USER}}@${{secrets.IP_SERVER_RUN}}
  WORK_DIR: /home/ubuntu/devops04/github_action_demo
  COMPOSE_FILE_DIR: /home/ubuntu/devops04
  IMG_NAME: nathanvo1489/github_action_demo_image:latest
  SERVICE_NAME: go_gin_be

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: webfactory/ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust host
        run: ssh-keyscan -H ${{secrets.IP_SERVER_RUN}} >> ~/.ssh/known_hosts

      - name: Check Dockerfile
        run: |
          ls -la
          test -f Dockerfile
      
      - name: Check env file
        run: |
          ssh  $SSH_SERVER "
            set -e
            cd $WORK_DIR
            test -f .env
          "

      - name: Check docker compose file
        run: |
          ssh  $SSH_SERVER "
            set -e
            cd $COMPOSE_FILE_DIR
            test -f docker-compose.yml
          "

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Docker build img
        run: docker build -t $IMG_NAME .

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}
    
      - name: Docker push
        run: docker push $IMG_NAME

  deploy:
    needs: [check, build-and-push]

    runs-on: ubuntu-latest
    steps:
      - name: webfactory/ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust host
        run: ssh-keyscan -H ${{secrets.IP_SERVER_RUN}} >> ~/.ssh/known_hosts

      - name: deploy
        run: |
          ssh  $SSH_SERVER "
            set -e
            cd $COMPOSE_FILE_DIR

            docker compose pull $SERVICE_NAME
            docker compose up -d --force-recreate $SERVICE_NAME
            docker image prune -f
          "
 